<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food in France</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Alexandria:wght@400;600&family=Lobster&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Alexandria', sans-serif; background: #faf6f0; color: #2b2623; line-height: 1.6; }
        .topnav { background: #1e293b; display: flex; justify-content: center; flex-wrap: wrap; padding: 0.75rem; gap: 1rem; }
        .topnav a { color: #f8fafc; text-decoration: none; padding: 0.5rem 1.1rem; border-radius: 6px; font-size: 0.95rem; }
        .topnav a:hover { background: #334155; }
        .topnav a.active { background: #9f1239; font-weight: 600; }
        .hero { text-align: center; padding: 3rem 1rem 2rem; background: linear-gradient(135deg, #fff1f2 0%, #faf6f0 100%); border-bottom: 1px solid #e7e0d8; }
        .hero h1 { font-family: 'Lobster', cursive; font-size: 3.5rem; color: #881337; margin-bottom: 0.5rem; }
        .hero p { color: #57534e; max-width: 550px; margin: 0 auto; }
        .container { max-width: 1050px; margin: 2.5rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 240px 1fr; gap: 2rem; align-items: start; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 0.65rem; background: #fff; padding: 1rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #ece5dd; }
        .tab-btn { font-family: 'Alexandria', sans-serif; font-size: 1rem; text-align: left; padding: 0.85rem 1.1rem; border: none; border-radius: 8px; background: transparent; color: #44403c; cursor: pointer; transition: 0.2s; }
        .tab-btn:hover { background: #fff1f2; color: #881337; }
        .tab-btn.active-btn { background: #881337; color: #fff; font-weight: 600; }
        .content-area { background: #fff; padding: 2.25rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #ece5dd; min-height: 360px; }
        .food-box { display: none; }
        .food-box.active-box { display: block; }
        .food-box h2 { font-family: 'Lobster', cursive; font-size: 2.1rem; color: #881337; margin-bottom: 1rem; }
